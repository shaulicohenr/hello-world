# Single Argo CD Application (Part 1 of the GitOps exercise).
# Deploys the Helm chart with default values into the "hello-world" namespace.
# Do NOT apply this together with the App of Apps - it is a standalone alternative.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shaulicohenr/hello-world.git
    targetRevision: main
    path: helm/hello-world
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true