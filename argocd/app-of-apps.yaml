# Parent ("App of Apps"): watches argocd/apps/ in Git and creates the
# dev, stage and prod child Applications automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/shaulicohenr/hello-world.git
    targetRevision: main
    path: argocd/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true